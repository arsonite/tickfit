<!DOCTYPE html>

<html lang="en">
    <head>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.json" />

        <meta charset="UTF-8" />

        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="tickfit" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="theme-color" content="#0a0a0b" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

        <title>tickfit</title>

        <!-- The page is not white while the style and the data load -->
        <style>
            html,
            body {
                background: #0a0a0b;
            }
        </style>
        <script>
            try {
                if (JSON.parse(localStorage.getItem('tickfit-settings')).lightMode) {
                    document.documentElement.classList.add('light-boot');
                }
            } catch (error) {
                // No settings yet: the dark start
            }
        </script>
        <style>
            html.light-boot,
            html.light-boot body {
                background: #f8fafc;
            }
        </style>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/index.tsx"></script>
    </body>
</html>
